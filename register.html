<!DOCTYPE html>
<html lang="en">
<head>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/tailwind.js"></script>
    
</head>
<body class="auth-page bg-gradient-to-b from-blue-400 via-violet-300 relative to-cyan-200 w-full ">
    <main class="w-[90%] h-16 rounded-lg shadow-lg absolute left-[5%] top-6 bg-blue-100 px-3 flex items-center">
        <div class="logo-main h-full w-[24%] pl-2 text-3xl font-extrabold text-blue-700 flex items-center">E-Market Shp</div>
        <div class="list-main w-[45%] h-full px-4 ">
            <ul class="flex justify-center items-center h-full text-lg font-semibold text-blue-700 text-center ">
                <li class="ml-5"><a href="index.html">Home</a></li>
                <li class="ml-5">About</li>
                <li class="ml-5">Contact</li>
                <li class="ml-5">Services</li>
                <li class="ml-5">Products</li>
                <li class="ml-5">Blog</li>
            </ul>
        </div>
        <div class="user-main h-full w-[30%] flex justify-end items-center">
            <button class="bg-blue-700 text-white px-4 py-2 rounded-lg hover:bg-blue-800"><a href="login.html">Login</a></button>
            <button class="bg-blue-700 text-white px-4 py-2 rounded-lg ml-3 hover:bg-blue-800"><a href="register.html">Sign Up</a></button>
        </div>
    </main>
    <section class="con-sign w-80% h-screen flex items-center justify-center">
        <div class="bg-blue-100 p-6 w-[470px] h-[440px] rounded-3xl shadow-md">
            <h2 class="text-4xl font-extrabold text-center text-blue-600 my-4">Sign Up</h2>
            <form class="flex flex-col items-center justify-evenly ">
                <input type="text" placeholder="Enter Your User Name" class="w-[300px] h-12 rounded-lg p-2 text-black my-3 outline-none" id="UserNameReg">
                <input type="email" placeholder="Enter Your Email" class="w-[300px] h-12 rounded-lg p-2 text-black my-3 outline-none" id="EmailReg">
                <input type="password" placeholder="Enter Your Password" class="w-[300px] h-12 rounded-lg p-2 text-black my-3 outline-none" id="PasswordReg">
                <button class="bg-blue-700 text-white px-4 py-2 rounded-lg hover:bg-blue-800 my-2" id="SignUpButton">Sign Up</button>
            </form>
            <span class="text-red-600 text-sm my-2 text-center block" id="ErrorMessageReg"></span><span class="block text-center succ-mass text-green-400 text-sm my-2" id="SuccessMessageReg"></span>
            <p class="text-center text-black my-3">Already have an account? <a href="login.html" class="text-blue-700 hover:underline">Login</a></p>
        </div>
    </section>
    <footer class="site-footer">
        <a class="footer-link" href="login.html"><i class="fa-solid fa-user"></i><span>Account</span></a>
        <p>&copy; 2026 Alahmedi. All rights reserved.</p>
        <div class="footer-links">
            <a class="footer-link" href="#privacy"><i class="fa-solid fa-shield-halved"></i><span>Privacy</span></a>
            <a class="footer-link" href="#terms"><i class="fa-solid fa-file-contract"></i><span>Terms</span></a>
        </div>
    </footer>
    <script src="js/register.js"></script>
</body>
</html>

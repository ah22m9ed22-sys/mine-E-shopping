<!DOCTYPE html>
<html lang="en">
<head>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/tailwind.js"></script>
    
</head>
<body class="cart-page bg-gradient-to-b from-blue-400 via-violet-300 to-cyan-200 w-full ">
    <main class="w-[90%] h-16 rounded-lg shadow-lg fixed left-[5%] top-6 bg-blue-100 px-3 flex items-center z-50">
        <div class="logo-main h-full w-[24%] pl-2 text-3xl font-extrabold text-blue-700 flex items-center">E-Market Shp</div>
        <div class="search-box relative w-96 h-full bg-blue-100 rounded-3xl flex items-center p-1" id="searchBox"><button type="button" class="search-button" id="searchButton" aria-label="Open search"><i class="fa-solid fa-magnifying-glass font-bold text-2xl mx-2 text-blue-500"></i></button><input type="search" class="search-input w-full bg-blue-100 outline-0 focus:outline-none px-3" id="searchInput" aria-label="Search cart products"></div>
        <div class="list-main w-[45%] h-full px-4 ">
            <ul class="flex justify-center items-center h-full text-lg font-semibold text-blue-700 text-center ">
                <li class="ml-5 cursor-pointer"><a href="index.html">Home</a></li>
                <li class="ml-5 cursor-pointer">About</li>
                <li class="ml-5 cursor-pointer">Contact</li>
                <li class="ml-5 cursor-pointer"><a href="cartproducts.html">Cart</a></li>
                <li class="ml-5 cursor-pointer">Products</li>
                <li class="ml-5 cursor-pointer">Blog</li>
            </ul>
        </div>
        <div class="user-main h-full w-[30%] flex justify-end items-center">
            <div class="user-info hidden flex items-center justify-around" id="userInfo">
                <i class="fa-solid fa-circle-user text-2xl text-blue-500 mx-2"></i>
                <div class="text-lg font-semibold text-blue-700" id="userInfoName"></div>
                <button class="bg-red-500 text-white px-4 py-2 m-2 rounded-lg hover:bg-red-600 active:bg-red-300" id="logoutButton">Logout</button>
            </div>
            <div class="linls " id="linksHome">
                <button class="bg-blue-700 text-white px-4 py-2 rounded-lg hover:bg-blue-800 active:bg-blue-300"><a href="login.html">Login</a></button>
            <button class="bg-blue-700 text-white px-4 py-2 rounded-lg ml-3 hover:bg-blue-800 active:bg-blue-300"><a href="register.html">Sign Up</a></button>
            </div>
        </div>
    </main>
    <h2 class="text-center font-bold text-3xl text-white mt-28">Cart Products</h2>
    <section class="main-products w-[90%] min-h-[400px] m-auto p-3 mt-32">
        <div class="products-container grid grid-cols-5 gap-4" id="productsCartContainer">
            
        </div>
    </section>
    <hr class=" w-[50%] m-auto my-20 border-2 border-blue-800 hover:border-blue-600 hover:w-[95%] transition-all duration-200 rounded-4xl">
    <h2 class="text-center font-bold text-3xl text-pink-500">Favorite Products</h2>
    <section class="main-fave w-[90%] min-h-[400px] m-auto p-3 mt-32">
        <div class="products-container grid grid-cols-5 gap-4" id="productsFaveContainer">
            
        </div>
    </section>
    <div class="details-modal" id="productDetailsModal" aria-hidden="true">
        <div class="details-panel" role="dialog" aria-modal="true" aria-labelledby="detailsProductName">
            <button type="button" class="details-close" id="closeDetailsButton" aria-label="Close product details">&times;</button>
            <img id="detailsProductImage" class="details-image" src="" alt="">
            <h2 id="detailsProductName"></h2>
            <p id="detailsProductTitle"></p>
            <strong id="detailsProductPrice"></strong>
        </div>
    </div>
    <footer class="site-footer">
        <a class="footer-link" href="login.html"><i class="fa-solid fa-user"></i><span>Account</span></a>
        <p>&copy; 2026 Alahmedi. All rights reserved.</p>
        <div class="footer-links">
            <a class="footer-link" href="#privacy"><i class="fa-solid fa-shield-halved"></i><span>Privacy</span></a>
            <a class="footer-link" href="#terms"><i class="fa-solid fa-file-contract"></i><span>Terms</span></a>
        </div>
    </footer>
    <script src="js/cartproducts.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/tailwind.js"></script>
    
</head>
<body class="bg-gradient-to-b from-blue-400 via-violet-300 relative to-cyan-200 w-full min-h-[2000px] ">
    <main class="w-[90%] h-16 rounded-lg shadow-lg absolute left-[5%] top-6 bg-blue-100 px-3 flex items-center">
        <div class="logo-main h-full w-[24%] pl-2 text-3xl font-extrabold text-blue-700 flex items-center">E-Market Shp</div>
        <div class="list-main w-[50%] h-full px-4 ">
            <ul class="flex justify-center items-center h-full text-lg font-semibold text-blue-700 text-center ">
                <li class="ml-5"><a href="index.html">Home</a></li>
                <li class="ml-5">About</li>
                <li class="ml-5">Contact</li>
                <li class="ml-5">Services</li>
                <li class="ml-5">Products</li>
                <li class="ml-5">Blog</li>
            </ul>
        </div>
        <div class="user-main h-full w-[26%] flex justify-end items-center">
            <button class="bg-blue-700 text-white px-4 py-2 rounded-lg hover:bg-blue-800"><a href="login.html">Login</a></button>
            <button class="bg-blue-700 text-white px-4 py-2 rounded-lg ml-3 hover:bg-blue-800"><a href="register.html">Sign Up</a></button>
        </div>
    </main>
    <section class="con-sign w-80% h-screen flex items-center justify-center">
        <div class="bg-blue-100 p-6 w-[470px] h-[420px] rounded-3xl shadow-md">
            <h2 class="text-4xl font-extrabold text-center text-blue-600 my-4">Login</h2>
            <form class="flex flex-col items-center justify-evenly w-full h-[50%] my-10">
                <input type="text" placeholder="Enter Your User Name" class="w-[300px] h-12 rounded-lg p-2 text-black my-3 outline-none" id="UserNameLogin">
                <input type="password" placeholder="Enter Your Password" class="w-[300px] h-12 rounded-lg p-2 text-black my-3 outline-none" id="PasswordLogin">
                <button class="bg-blue-700 text-white px-4 py-2 rounded-lg hover:bg-blue-800 my-2" id="LoginButton">Login</button>
            </form>
            <span class="text-red-600 text-sm my-2 text-center block" id="ErrorMessageLog"></span><span class="block text-center succ-mass text-green-400 text-sm my-2" id="SuccessMessageLog"></span>
            <p class="text-center text-black my-3">Don't have an account? <a href="register.html" class="text-blue-700 hover:underline">Sign Up</a></p>
        </div>
    </section>
    <script src="js/login.js"></script>
</body>
</html>
